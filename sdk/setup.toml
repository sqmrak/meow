# what `meow setup` installs, every download is pinned by sha256 and every git checkout by commit
# the toolchain is the clang 11.1.0 of the theos toolchain, the one meow is checked against

# the sdks `meow setup sdks` installs: armv6 takes 5.1, armv7 the newest up to 10.3 and the tbd sdks above 6.1 lack armv7 libraries, arm64 the newest
sdks = ["5.1", "6.1", "16.5"]

